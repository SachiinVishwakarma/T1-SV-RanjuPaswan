<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login pages</title>
    <link rel="stylesheet" href="/Level1/css_file/login.css">
</head>
<body>
    <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to continue to your dashboard</p>

        <form id="login">
            <div class="group">
                <label>Email Address:</label>
                <input type="email" id="email" placeholder="Enter your email address">
                <p class="error-text" id="emailerror">Please enter a valid email</p>
            </div>


            <div class="group">
                <label> passward:</label>
                <input type="password" id="pass" placeholder="Enter your passward">
                <p class="error-text" id="passworderror">Password must be at least 8 character long</p>
            </div>

            <p class="hint">Password must be at least 8 character long.</p>
            <div class="remember">
                <label>
                    <input type="checkbox" id="check">
                    Remember me for 30 days
                </label>
                  <a href="#" class="forget">Forgot Password</a>

            </div>

            

            <button type="submit" class="btn">Sign in</button>
            </form>

            <p class="footer-text">New to WebTech Practice? <a href="signinPage.html">Create an account</a></p>
        
    </div>
    <script src="/Level1/js_file/login.js"></script>
</body>
</html>
